# karina.kovcheg.ai — Outsistent site (static Next export) + lead form API.
# Installed on the DO droplet (KOVCHEG, 170.64.187.154) as /etc/nginx/sites-available/karina.kovcheg.ai
# with a symlink in sites-enabled. Static files: /var/www/karina.kovcheg.ai/dist (rsync of site/out).
# /api/ goes over Tailscale to karina-leads.service on the Hetzner box (100.91.124.2:3240).
# certbot --nginx adds the 443 server and the redirect.

server {
    listen 80;
    server_name karina.kovcheg.ai;
    server_tokens off;

    root /var/www/karina.kovcheg.ai/dist;
    index index.html;
    client_max_body_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://100.91.124.2:3240/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(images|video)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
